name: VinoLog

entities:
  User:
    authenticable: true
    properties:
      - name
      - name: email
        type: email
      - name: role
        type: choice
        options:
          values: [admin, user]
        default: user
    policies:
      create:
        - access: admin
      read:
        - access: restricted
          allow: User
          condition: self
      update:
        - access: restricted
          allow: User
          condition: self
      delete:
        - access: admin
      signup:
        - access: public

  GrapeVariety:
    properties:
      - name: name
        type: string
      - name: color
        type: choice
        options:
          values: [Red, White, Rosé]
      - name: origin
        type: string
      - name: description
        type: text
    policies:
      create:
        - access: admin
      read:
        - access: public
      update:
        - access: admin
      delete:
        - access: admin

  TastingNote:
    properties:
      - name: vintage
        type: number
      - name: wineName
        type: string
      - name: aromaNotes
        type: text
      - name: tasteNotes
        type: text
      - name: rating
        type: number
      - name: tastingDate
        type: date
    belongsTo:
      - name: author
        entity: User
      - name: grapeVariety
        entity: GrapeVariety
    policies:
      create:
        - access: restricted
          allow: User
      read:
        - access: public
      update:
        - access: restricted
          allow: User
          condition: self
      delete:
        - access: restricted
          allow: User
          condition: self


# Health check endpoint for connection testing
endpoints:
  health:
    path: /api/health
    method: GET
    policies: []
    handler: healthCheck